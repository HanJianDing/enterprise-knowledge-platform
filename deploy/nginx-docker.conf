# Docker 部署用 nginx 配置（默认站点；被 frontend 镜像打进 /etc/nginx/conf.d/default.conf）
#
# 两个致命配置说明：
# - client_max_body_size 21m：应用上传上限 20MB，nginx 默认 1m 会先 413
# - proxy_buffering off + proxy_read_timeout 300s：SSE 流式回答必须关缓冲，否则卡住不输出

server {
    listen 80;
    server_name _;

    client_max_body_size 21m;

    root /usr/share/nginx/html;
    index index.html;

    # API 反代到 backend 容器（proxy_pass 不带尾斜杠 → /api/v1 路径原样透传）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 健康检查直通后端
    location = /health {
        proxy_pass http://backend:8000;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA（BrowserRouter）回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
