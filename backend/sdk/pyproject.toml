[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-kb-client"
version = "0.1.0"
description = "企业知识库（RAG）Python SDK——OpenAI 兼容对话门 + Dify 兼容检索门的薄封装"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rag_kb_client*"]
